<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Alastor: O Herdeiro das Cinzas — Um RPG medieval sombrio com magia, pactos demoníacos e múltiplos finais.">
<meta name="author" content="Seu Nome">
<meta name="theme-color" content="#0a0604">
<meta property="og:title" content="Alastor: O Herdeiro das Cinzas">
<meta property="og:description" content="RPG medieval sombrio em HTML/CSS/JS. 28 magias, 7 pactos demoníacos, 13+ finais.">
<meta property="og:type" content="website">
<title>Alastor: O Herdeiro das Cinzas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌑</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=UnifrakturMaguntia&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;color:#d8d2c8;font-family:'Crimson Text',Georgia,serif;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;}
  #game{width:1100px;height:720px;background:radial-gradient(ellipse at 50% 20%,#1a1210 0%,#080606 60%,#000 100%);border:1px solid #4a2a10;box-shadow:0 0 60px #000,inset 0 0 100px #000,0 0 30px rgba(120,20,20,0.15);position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:16px;}
  #game::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 85%,rgba(120,0,0,0.10) 0%,transparent 45%),radial-gradient(circle at 85% 15%,rgba(80,60,20,0.08) 0%,transparent 45%);pointer-events:none;animation:fog 15s ease-in-out infinite alternate;z-index:0;}
  @keyframes fog{0%{opacity:0.5;transform:scale(1);}100%{opacity:1;transform:scale(1.05);}}
  #game::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 120px 30px #000;pointer-events:none;z-index:2;}
  #header{padding:9px 20px;background:linear-gradient(180deg,#0d0805,#050202);border-bottom:1px solid #4a2a10;display:flex;justify-content:space-between;align-items:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:#b8944f;text-transform:uppercase;z-index:3;position:relative;gap:8px;}
  #header span{text-shadow:0 0 10px rgba(184,148,79,0.5);white-space:nowrap;}
  #location{color:#e0b860;font-weight:700;flex:1;}
  #main{flex:1;display:flex;z-index:1;position:relative;overflow:hidden;}
  #screen{flex:1;padding:24px 36px;overflow-y:auto;position:relative;z-index:1;}
  #screen::-webkit-scrollbar{width:7px;}
  #screen::-webkit-scrollbar-track{background:#0a0604;}
  #screen::-webkit-scrollbar-thumb{background:#5a3a18;border-radius:3px;}
  #sidePanel{width:250px;background:linear-gradient(180deg,#0a0604,#050202);border-left:1px solid #3a2a1a;padding:10px;display:flex;flex-direction:column;gap:5px;z-index:3;overflow-y:auto;}
  #sidePanel::-webkit-scrollbar{width:4px;}
  #sidePanel::-webkit-scrollbar-thumb{background:#3a2a1a;}
  .panel-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:#b8944f;text-align:center;border-bottom:1px solid #3a2a1a;padding-bottom:4px;margin-bottom:3px;margin-top:6px;}
  .attr-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#c0b0a0;letter-spacing:1px;}
  .attr-row .val{color:#f0d8a0;font-weight:700;}
  .sprite-frame{width:100%;height:160px;background:radial-gradient(circle at 50% 70%,#1a0a0a 0%,#050202 100%);border:1px solid #3a2a1a;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;position:relative;overflow:hidden;box-shadow:inset 0 0 30px #000;}
  .sprite-frame::before{content:'';position:absolute;width:110px;height:110px;background:radial-gradient(circle,rgba(160,40,40,0.3) 0%,transparent 70%);bottom:5px;left:50%;transform:translateX(-50%);border-radius:50%;animation:auraPulse 4s ease-in-out infinite;}
  @keyframes auraPulse{0%,100%{opacity:0.4;transform:translateX(-50%) scale(1);}50%{opacity:0.8;transform:translateX(-50%) scale(1.15);}}
  h1{font-family:'UnifrakturMaguntia',serif;color:#e04040;text-align:center;font-size:48px;letter-spacing:3px;text-shadow:0 0 25px #500,0 0 50px #300,0 2px 4px #000;margin-bottom:12px;line-height:1.1;animation:titlePulse 3.5s infinite;}
  @keyframes titlePulse{0%,100%{text-shadow:0 0 25px #500,0 0 50px #300,0 2px 4px #000;}50%{text-shadow:0 0 35px #a00,0 0 70px #500,0 2px 4px #000;}}
  h2{font-family:'Cinzel',serif;color:#e0b860;font-size:19px;letter-spacing:3px;margin:16px 0 12px;text-transform:uppercase;border-bottom:1px solid #5a3a18;padding-bottom:7px;}
  p{line-height:1.85;margin-bottom:14px;color:#e0d8cc;font-size:17px;}
  .narration{font-style:italic;color:#c0b0a0;font-size:17px;}
  .whisper{color:#ff5060;font-style:italic;text-shadow:0 0 12px #800;animation:whisperFade 3s infinite;}
  @keyframes whisperFade{0%,100%{opacity:0.8;}50%{opacity:1;}}
  .satella{color:#ffb070;font-style:italic;font-weight:600;}
  .satella-god{color:#ffe080;font-style:italic;font-weight:700;text-shadow:0 0 15px #fa0,0 0 30px #a80;}
  .alastor{color:#80c0ff;font-style:italic;font-weight:600;}
  .demon{color:#d060ff;font-style:italic;font-weight:600;text-shadow:0 0 12px #a0a;}
  .satan{color:#ff0040;font-style:italic;font-weight:700;text-shadow:0 0 20px #f00,0 0 40px #800,0 0 80px #400;animation:titlePulse 2s infinite;}
  .god{color:#ffe080;font-style:italic;font-weight:600;text-shadow:0 0 15px #fa0,0 0 30px #a80;}
  .villager{color:#b0e090;font-style:italic;font-weight:600;}
  .merchant{color:#ffd060;font-style:italic;font-weight:600;}
  .cult{color:#ff3070;font-style:italic;font-weight:600;text-shadow:0 0 12px #f00;}
  .narrator{color:#a89888;font-style:italic;}
  .namaroth{color:#c060ff;font-style:italic;font-weight:700;text-shadow:0 0 20px #a0a;}
  .loot{color:#f0d888;font-weight:600;font-size:16px;}
  .accent{color:#e04040;font-weight:700;}
  .grimoire{color:#d080ff;font-style:italic;text-shadow:0 0 15px #8020ff;font-weight:600;}
  .blind-text{color:#a0d0ff;font-style:italic;font-weight:600;}
  .hp-cost-text{color:#ff5050;font-style:italic;font-weight:600;}
  .shadow-magic{color:#a020c0;font-style:italic;font-weight:600;text-shadow:0 0 15px #8020a0;}
  button{background:linear-gradient(180deg,#1a1008,#0a0604);color:#e0c8a0;border:1px solid #6a4a20;padding:13px 22px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.5px;cursor:pointer;margin:4px;transition:all 0.25s;text-transform:uppercase;position:relative;overflow:hidden;font-weight:600;}
  button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(224,184,96,0.2),transparent);transition:left 0.4s;}
  button:hover::before{left:100%;}
  button:hover{background:linear-gradient(180deg,#3a2010,#1a0804);color:#ffd090;border-color:#d0a040;box-shadow:0 0 20px rgba(208,160,64,0.6);transform:translateY(-1px);}
  button:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  button.danger{border-color:#a02020;color:#ff8080;}
  button.danger:hover{background:#3a0808;color:#ffa0a0;border-color:#e04040;}
  button.magic-btn{border-color:#705090;color:#d0b0ff;}
  button.magic-btn:hover{border-color:#b080ff;color:#e0c8ff;}
  button.cult-btn{border-color:#a02050;color:#ff60a0;}
  button.cult-btn:hover{border-color:#e03070;color:#ff90c0;}
  button.grimoire-btn{border-color:#8030c0;color:#e090ff;}
  button.grimoire-btn:hover{border-color:#c060ff;color:#f0b0ff;}
  button.satella-btn{border-color:#a06020;color:#ffd070;}
  button.satella-btn:hover{border-color:#e0a040;color:#ffe090;}
  button.demon-btn{border-color:#8020c0;color:#d080ff;}
  button.demon-btn:hover{border-color:#c060ff;color:#f0a0ff;box-shadow:0 0 25px rgba(192,96,255,0.7);}
  button.satan-btn{border-color:#a00020;color:#ff4060;background:linear-gradient(180deg,#2a0008,#0a0004);}
  button.satan-btn:hover{border-color:#ff0040;color:#ff6080;box-shadow:0 0 30px rgba(255,0,64,0.8);transform:scale(1.02);}
  .choices{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
  .choices button{text-align:left;padding:14px 20px;font-size:12px;}
  .choices button::after{content:'›';position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#c0a050;font-size:20px;transition:right 0.25s;}
  .choices button:hover::after{right:12px;color:#ffd090;}
  #stats{display:flex;gap:14px;padding:10px 20px;background:linear-gradient(180deg,#050202,#0d0805);border-top:1px solid #4a2a10;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;z-index:3;position:relative;}
  .stat{flex:1;color:#c0a050;}
  .stat .bar{height:11px;background:#0a0604;border:1px solid #4a2a1a;margin-top:4px;position:relative;overflow:hidden;}
  .bar-fill{height:100%;transition:width 0.6s ease-out;position:relative;}
  .hp .bar-fill{background:linear-gradient(90deg,#500,#c03030 70%,#e05050);}
  .mana .bar-fill{background:linear-gradient(90deg,#102040,#4080c0 70%,#60a0e0);}
  .mana-shadow .bar-fill{background:linear-gradient(90deg,#2a0040,#8020a0 70%,#c040e0);}
  .insanity .bar-fill{background:linear-gradient(90deg,#2a1030,#8020a0 70%,#c040e0);animation:insanityPulse 2s infinite;}
  @keyframes insanityPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.3);}}
  .bar-text{display:flex;justify-content:space-between;font-size:11px;}
  .magic-card{background:linear-gradient(180deg,rgba(20,10,5,0.95),rgba(5,2,1,0.95));border:1px solid #6a4a20;padding:24px;margin:14px 0;text-align:center;animation:revealMagic 1.8s ease-out;box-shadow:0 0 40px rgba(120,60,0,0.3),inset 0 0 40px rgba(0,0,0,0.8);}
  @keyframes revealMagic{0%{opacity:0;transform:scale(0.7) rotate(-5deg);filter:blur(15px);}100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0);}}
  .rarity-comum{color:#a0a0a0;}
  .rarity-rara{color:#50c8ff;text-shadow:0 0 12px #4080ff;}
  .rarity-muito_rara{color:#d080ff;text-shadow:0 0 14px #8020ff;}
  .rarity-lendaria{color:#ffc050;text-shadow:0 0 20px #ff8000,0 0 40px #a04000;}
  .rarity-mitica{color:#ff5070;text-shadow:0 0 25px #ff0040,0 0 50px #a00020;animation:titlePulse 1.5s infinite;}
  .rarity-arcana{color:#ff40ff;text-shadow:0 0 30px #f0f,0 0 60px #a0a;animation:arcanaPulse 1s infinite;}
  @keyframes arcanaPulse{0%,100%{text-shadow:0 0 30px #f0f,0 0 60px #a0a;}50%{text-shadow:0 0 45px #f0f,0 0 90px #a0a;}}
  .grimoire-card{background:linear-gradient(135deg,#1a0520,#0a0208);border:2px solid #a040ff;padding:22px;margin:12px 0;text-align:center;animation:revealMagic 1.5s ease-out;box-shadow:0 0 50px rgba(160,64,255,0.5);}
  .arcana-card{background:linear-gradient(135deg,#2a0020,#0a0008);border:2px solid #ff40ff;padding:25px;margin:12px 0;text-align:center;animation:revealMagic 1.5s ease-out;box-shadow:0 0 60px rgba(255,64,255,0.6);position:relative;overflow:hidden;}
  .arcana-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,64,255,0.2),transparent 30%);animation:rotateGlow 4s linear infinite;}
  @keyframes rotateGlow{to{transform:rotate(360deg);}}
  .arcana-card>*{position:relative;z-index:1;}
  .satan-card{background:linear-gradient(135deg,#2a0008,#0a0002);border:2px solid #ff0040;padding:30px;margin:14px 0;text-align:center;animation:revealMagic 1.5s ease-out;box-shadow:0 0 80px rgba(255,0,64,0.7);position:relative;overflow:hidden;}
  .satan-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,0,64,0.25),transparent 30%);animation:rotateGlow 3s linear infinite;}
  .satan-card>*{position:relative;z-index:1;}
  .combat-arena{display:flex;justify-content:space-around;align-items:center;padding:14px 0;background:radial-gradient(ellipse at center,rgba(80,10,10,0.3) 0%,transparent 70%);border:1px solid #3a1a0a;margin:12px 0;min-height:180px;}
  .fighter{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .fighter .name{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;color:#e0b860;font-weight:600;}
  .fighter .hp-mini{width:110px;height:8px;background:#0a0604;border:1px solid #3a2a1a;}
  .fighter .hp-mini div{height:100%;transition:width 0.4s;}
  .enemy-hp div{background:linear-gradient(90deg,#500,#e05050);}
  .player-hp div{background:linear-gradient(90deg,#204060,#60a0e0);}
  .attack-anim{animation:attackLunge 0.35s;}
  @keyframes attackLunge{0%{transform:translateX(0);}50%{transform:translateX(30px);}100%{transform:translateX(0);}}
  .hit-anim{animation:hitShake 0.35s;}
  @keyframes hitShake{0%,100%{transform:translateX(0);filter:brightness(1);}30%{transform:translateX(-10px);filter:brightness(2);}60%{transform:translateX(8px);filter:brightness(1.5);}}
  .float-dmg{position:absolute;color:#ff5050;font-family:'Cinzel',serif;font-weight:700;font-size:22px;text-shadow:0 0 12px #f00,0 2px 4px #000;animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:10;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.8);}100%{opacity:0;transform:translateY(-60px) scale(1.3);}}
  #combatLog{max-height:95px;overflow-y:auto;background:rgba(0,0,0,0.7);border:1px solid #3a2a1a;padding:8px 12px;font-size:13px;color:#d0c0b0;font-style:italic;margin:8px 0;}
  #combatLog p{margin-bottom:4px;font-size:13px;line-height:1.4;}
  .skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0;}
  .skill-card{background:linear-gradient(180deg,#150a05,#080403);border:1px solid #4a2a10;padding:11px 13px;cursor:pointer;transition:all 0.25s;}
  .skill-card:hover{border-color:#d0a040;background:linear-gradient(180deg,#251508,#150a05);transform:translateY(-2px);}
  .skill-card .sk-name{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:#f0d8a0;margin-bottom:3px;font-weight:600;}
  .skill-card .sk-cost{font-size:11px;color:#80a0c0;letter-spacing:1px;}
  .skill-card .sk-desc{font-size:12px;color:#b0a090;font-style:italic;margin-top:4px;line-height:1.35;}
  .skill-card.locked{opacity:0.4;cursor:not-allowed;filter:grayscale(1);}
  .skill-card.unlocked{border-color:#a08040;}
  .skill-card.shadow{border-color:#8020a0;background:linear-gradient(180deg,#200a20,#0a0210);}
  .skill-card.shadow .sk-name{color:#d080ff;}
  .flash-red{animation:flashRed 0.5s;}@keyframes flashRed{0%{background:rgba(255,0,0,0.4);}100%{background:transparent;}}
  .flash-white{animation:flashWhite 0.5s;}@keyframes flashWhite{0%{background:rgba(255,255,255,0.5);}100%{background:transparent;}}
  .flash-purple{animation:flashPurple 0.6s;}@keyframes flashPurple{0%{background:rgba(160,20,160,0.5);}100%{background:transparent;}}
  .flash-gold{animation:flashGold 0.6s;}@keyframes flashGold{0%{background:rgba(255,200,50,0.5);}100%{background:transparent;}}
  .flash-black{animation:flashBlack 1.2s;}@keyframes flashBlack{0%{background:rgba(0,0,0,0.95);}50%{background:rgba(0,0,0,0.7);}100%{background:transparent;}}
  .flash-crimson{animation:flashCrimson 0.8s;}@keyframes flashCrimson{0%{background:rgba(180,0,30,0.6);}100%{background:transparent;}}
  .flash-hell{animation:flashHell 1s;}@keyframes flashHell{0%{background:rgba(255,0,40,0.8);}50%{background:rgba(80,0,0,0.9);}100%{background:transparent;}}
  .blind-effect{animation:blindWobble 0.8s;filter:blur(2px) brightness(1.5) hue-rotate(180deg);}
  @keyframes blindWobble{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-5px) rotate(-2deg);}75%{transform:translateX(5px) rotate(2deg);}}
  .hp-cost-effect{animation:hpCostPulse 0.6s;}
  @keyframes hpCostPulse{0%,100%{box-shadow:inset 0 0 0 rgba(255,0,0,0);}50%{box-shadow:inset 0 0 60px rgba(255,0,0,0.5);}}
  .blood-drip{position:absolute;width:2px;height:20px;background:linear-gradient(180deg,#ff0000,#800000);animation:bloodDrip 1.5s ease-out forwards;pointer-events:none;}
  @keyframes bloodDrip{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(80px);}}
  .shake{animation:shake 0.4s;}@keyframes shake{0%,100%{transform:translate(0,0);}20%{transform:translate(-8px,3px);}40%{transform:translate(6px,-4px);}60%{transform:translate(-5px,2px);}80%{transform:translate(4px,-2px);}}
  .insanity-effect{animation:insanityWobble 3s infinite;}
  @keyframes insanityWobble{0%,100%{transform:skew(0deg);}25%{transform:skew(0.3deg);}75%{transform:skew(-0.3deg);}}
  .pixel-sprite{position:relative;z-index:1;image-rendering:pixelated;filter:contrast(1.1) saturate(1.1);}
  .village-scene{background:linear-gradient(180deg,#1a0a08 0%,#0a0503 100%);border:1px solid #3a1a0a;padding:20px;margin:10px 0;}
  .shop-item{display:flex;justify-content:space-between;align-items:center;background:rgba(20,10,5,0.7);border:1px solid #4a2a10;padding:10px 14px;margin:6px 0;}
  .shop-item:hover{border-color:#d0a040;}
  .shop-item .item-name{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:#f0d8a0;font-weight:600;}
  .shop-item .item-desc{font-size:12px;color:#b0a090;font-style:italic;margin-top:3px;}
  .shop-item .item-price{font-family:'Cinzel',serif;color:#ffd060;font-size:14px;font-weight:600;}
  .shop-item button{padding:6px 12px;font-size:10px;margin:0;}
  .gold-display{font-family:'Cinzel',serif;color:#ffd060;font-size:14px;letter-spacing:2px;text-align:right;margin-bottom:8px;font-weight:600;}
  .cult-scene{background:linear-gradient(180deg,#2a0010,#0a0004);border:1px solid #a02050;padding:20px;margin:10px 0;}
  .lore-box{background:rgba(15,8,4,0.9);border-left:3px solid #b8944f;padding:14px 18px;margin:12px 0;font-style:italic;color:#d0c0a0;}
  .lore-title{font-family:'Cinzel',serif;color:#e0b860;font-size:13px;letter-spacing:3px;margin-bottom:6px;text-transform:uppercase;font-weight:600;}
  .macabre-npc{background:linear-gradient(180deg,#1a0a05,#050201);border:1px solid #604020;padding:16px;margin:10px 0;}
  .npc-name{font-family:'Cinzel',serif;color:#c08040;font-size:15px;letter-spacing:2px;margin-bottom:6px;font-weight:600;}
  .npc-desc{font-size:15px;color:#d0c0b0;font-style:italic;}
  .dialogue{background:rgba(0,0,0,0.5);border-left:3px solid #e04040;padding:14px 18px;margin:10px 0;}
  .first-person-active{font-family:'Crimson Text',serif;font-size:18px;color:#e8e0d0;line-height:1.9;}
  .first-person-active p{font-size:18px;color:#e8e0d0;}
  .fp-thought{color:#a0c0ff;font-style:italic;padding-left:20px;border-left:2px solid #4080c0;margin:10px 0;}
  .fp-action{color:#e0c0a0;font-style:italic;}
  .fp-sensation{color:#ffb070;font-style:italic;}
  .fp-indicator{display:inline-block;font-family:'Cinzel',serif;font-size:9px;color:#b8944f;border:1px solid #6a4a20;padding:2px 8px;margin-bottom:8px;letter-spacing:2px;}
  .sys-menu{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
  .sys-menu button{padding:8px 14px;font-size:10px;}
  .bestiary-entry{background:linear-gradient(180deg,#1a0804,#050201);border:1px solid #6a4a20;padding:14px;margin:8px 0;}
  .bestiary-name{font-family:'Cinzel',serif;color:#e04040;font-size:16px;letter-spacing:2px;margin-bottom:4px;font-weight:600;}
  .bestiary-stats{font-size:12px;color:#a09080;margin-bottom:6px;font-style:italic;}
  .bestiary-desc{font-size:14px;color:#d0c0b0;font-style:italic;}
  .bestiary-locked{opacity:0.35;filter:grayscale(1);}
  .achv-toast{position:absolute;top:60px;right:20px;background:linear-gradient(180deg,#2a1a08,#0a0604);border:1px solid #e0b860;padding:12px 18px;box-shadow:0 0 30px rgba(224,184,96,0.6);z-index:100;animation:achvIn 0.5s ease-out;max-width:280px;}
  @keyframes achvIn{0%{opacity:0;transform:translateX(50px);}100%{opacity:1;transform:translateX(0);}}
  .achv-toast .achv-title{font-family:'Cinzel',serif;font-size:10px;color:#b8944f;letter-spacing:3px;margin-bottom:4px;text-transform:uppercase;}

  .hell-scene::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,rgba(255,0,64,0.2) 0%,transparent 60%);pointer-events:none;}

  .hell-demon .hd-title{color:#c0a0a0;font-style:italic;text-align:center;font-size:14px;margin-bottom:10px;}
  .hell-demon .hd-desc{color:#d0c0b0;font-size:14px;font-style:italic;line-height:1.6;margin-bottom:10px;}
  .hell-demon .hd-stats{background:rgba(0,0,0,0.4);border:1px solid #4a2020;padding:8px 12px;margin:8px 0;font-size:13px;}

  .satan-power-bar{background:linear-gradient(90deg,#1a0004,#400010,#800020,#ff0040);height:16px;border:1px solid #ff0040;margin:8px 0;position:relative;box-shadow:0 0 15px rgba(255,0,64,0.5);}

<script>
// ==================== ESTADO ====================
const game = {
  age:0, hp:100, hpMax:100, mana:100, manaMax:100, insanity:0,
  magic:null, magicRarity:null, hasPact:false,
  flags:{}, str:1, int:1, def:1, skills:[],
  gold:50, souls:0, reputation:0, hasMana:true,
  deityKills:0, inventory:[],
  grimoires:0, cultJoined:false,
  godsDefeated:[], arcanaUnlocked:false,
  loreFound:[], macabreNpcsMet:[],
  satellaTrust:50, satellaRevealed:false, satellaRebellion:false, satellaDead:false,
  achievements:[], bestiary:[], visitedMap:[], namarothDefeated:false,
  soundOn:true, 
  demonPacts:[], satanPower:0, voidRoute:false, hellUnlocked:false
};

const screen = document.getElementById('screen');
const locationEl = document.getElementById('location');
const ageEl = document.getElementById('age');
const magicEl = document.getElementById('magic');
const chapterEl = document.getElementById('chapter');
const goldEl = document.getElementById('gold');

// ==================== ÁUDIO ====================
let audioCtx = null;
function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume();}}
function playTone(freq,duration,type='sine',volume=0.08){if(!game.soundOn||!audioCtx)return;try{const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(volume,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration);}catch(e){}}
function sfxClick(){playTone(440,0.08,'triangle',0.05);}
function sfxDamage(){playTone(180,0.15,'sawtooth',0.12);setTimeout(()=>playTone(120,0.2,'sawtooth',0.08),80);}
function sfxVictory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.25,'sine',0.1),i*120));}
function sfxMagic(){[400,600,800,1000].forEach((f,i)=>setTimeout(()=>playTone(f,0.1,'triangle',0.08),i*50));}
function sfxWhisper(){playTone(150,0.6,'sine',0.04);setTimeout(()=>playTone(200,0.4,'sine',0.03),300);}
function sfxGod(){[220,277,330,440].forEach((f,i)=>setTimeout(()=>playTone(f,0.5,'sine',0.1),i*150));}
function sfxDark(){[100,80,60].forEach((f,i)=>setTimeout(()=>playTone(f,0.4,'sawtooth',0.1),i*200));}
function sfxHell(){[60,80,100,120,140,160,180].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sawtooth',0.15),i*100));}
function sfxPact(){[200,300,400,500,600].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'square',0.1),i*80));}

// ==================== SAVE ====================
const SAVE_KEY='alastor_save_v10';
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));updateContinueButton();}catch(e){}}
function loadGame(){try{const s=localStorage.getItem(SAVE_KEY);if(!s)return false;Object.assign(game,JSON.parse(s));return true;}catch(e){return false;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);updateContinueButton();}catch(e){}}
function updateContinueButton(){const btn=document.getElementById('continueBtn');if(btn)btn.style.display=hasSave()?'block':'none';}

// ==================== TELA INICIAL ====================
function showTitleScreen(){document.getElementById('titleScreen').style.display='flex';updateContinueButton();}
function hideTitleScreen(){document.getElementById('titleScreen').style.display='none';}
function startNewGame(){initAudio();sfxClick();clearSave();resetGame();hideTitleScreen();scenePrologo();}
function continueGame(){initAudio();sfxClick();if(loadGame()){hideTitleScreen();updateStats();if(game.magic)sceneTreino();else if(game.voidRoute)sceneSemMana3();else scenePrologo();}else{startNewGame();}}
function showAbout(){initAudio();sfxClick();alert('🌑 ALASTOR: O HERDEIRO DAS CINZAS\n\nUm RPG medieval sombrio em HTML/CSS/JS.\n\n• 28 magias\n• 7 pactos demoníacos\n• 13+ finais\n• Save automático\n\nCriado com ❤️ e magia sombria.\n\nVersão 10.0 — MIT License');}

// ==================== CONQUISTAS ====================
const ACHIEVEMENTS = [
  {id:'first_pact',name:'O Pacto',desc:'Vendeu sua alma a Namaroth.'},
  {id:'satella_reveal',name:'A Verdade',desc:'Descobriu que Satella é uma deusa.'},
  {id:'first_deity',name:'Matador de Deuses',desc:'Matou o Primeiro Deus.'},
  {id:'all_deities',name:'Deicida',desc:'Matou todos os cinco deuses.'},
  {id:'arcana',name:'Poder Ancestral',desc:'Desbloqueou uma magia ARCANA.'},
  {id:'namaroth',name:'O Sexto',desc:'Derrotou Namaroth.'},
  {id:'true_ending',name:'A Rebelião das Deusas',desc:'Final secreto.'},
  {id:'no_mana',name:'O Vazio',desc:'Sobreviveu sem mana.'},
  {id:'all_lore',name:'Escriba',desc:'Todos os 11 fragmentos.'},
  {id:'first_demon',name:'Primeiro Contrato',desc:'Primeiro pacto com demônio.'},
  {id:'three_demons',name:'Colecionador',desc:'3 pactos demoníacos.'},
  {id:'five_demons',name:'Legião',desc:'5 pactos demoníacos.'},
  {id:'all_demons',name:'OS SETE',desc:'Todos os 7 pactos.'},
  {id:'full_satan',name:'O NOVO SATANÁS',desc:'Tornou-se o próprio Satanás.'},
];
function unlockAchievement(id){if(game.achievements.includes(id))return;game.achievements.push(id);const a=ACHIEVEMENTS.find(x=>x.id===id);if(!a)return;const t=document.createElement('div');t.className='achv-toast';t.innerHTML=`<div class="achv-title">✦ Conquista ✦</div><div class="achv-name">${a.name}</div><div style="font-size:11px;color:#a09080;margin-top:4px;font-style:italic;">${a.desc}</div>`;document.getElementById('game').appendChild(t);setTimeout(()=>t.remove(),3500);sfxVictory();saveGame();}

function updateStats(){
  document.getElementById('hpBar').style.width=Math.max(0,(game.hp/game.hpMax)*100)+'%';
  document.getElementById('hpVal').textContent=Math.max(0,Math.floor(game.hp))+'/'+game.hpMax;
  document.getElementById('manaBar').style.width=Math.max(0,(game.mana/game.manaMax)*100)+'%';
  document.getElementById('manaVal').textContent=Math.floor(game.mana)+'/'+game.manaMax;
  document.getElementById('insanityBar').style.width=Math.min(100,game.insanity)+'%';
  document.getElementById('insVal').textContent=Math.floor(game.insanity)+'%';
  document.getElementById('attrStr').textContent=game.str;
  document.getElementById('attrInt').textContent=game.int;
  document.getElementById('attrDef').textContent=game.def;
  document.getElementById('attrMana').textContent=game.manaMax;
  document.getElementById('attrMad').textContent=Math.floor(game.insanity)+'%';
  document.getElementById('attrSouls').textContent=game.souls;
  document.getElementById('attrGrim').textContent=game.grimoires;
  document.getElementById('manaStat').classList.toggle('mana-shadow',game.hasPact);
  const dcRow=document.getElementById('demonCountRow');
  const satanRow=document.getElementById('satanPowerRow');
  if(game.demonPacts.length>0||game.voidRoute){dcRow.style.display='flex';document.getElementById('attrDemon').textContent=game.demonPacts.length+'/7';satanRow.style.display='flex';document.getElementById('attrSatan').textContent=Math.floor(game.satanPower)+'%';}else{dcRow.style.display='none';satanRow.style.display='none';}
  ageEl.textContent='Idade: '+game.age;
  magicEl.textContent='Magia: '+(game.magic?(game.hasPact?game.magic.nome+' (Sombria)':game.magic.nome):(game.hasMana?'???':'SEM MANA'));
  goldEl.textContent='Ouro: '+game.gold;
  const st=document.getElementById('satellaTitle'),si=document.getElementById('satellaInfo');
  if(game.flags.satellaVisible){st.style.display='block';si.style.display='block';let status='Escondida',color='#ffb070';if(game.satellaRevealed){status='DEUSA';color='#ffe080';}if(game.satellaRebellion){status='REBELDE';color='#ff60a0';}if(game.satellaDead){status='MORTA';color='#808080';}si.innerHTML=`<span style="color:${color};font-family:Cinzel;letter-spacing:2px;">${status}</span><br><span style="color:#a08060;">Confiança: ${game.satellaTrust}/100</span>`;}
  document.getElementById('pactTitle').style.display=game.hasPact?'block':'none';
  document.getElementById('pactInfo').style.display=game.hasPact?'block':'none';
  const rt=document.getElementById('reputTitle'),ri=document.getElementById('reputInfo');
  if(game.flags.reputationVisible){rt.style.display='block';ri.style.display='block';const r=game.reputation;let label='Neutro',color='#c0b0a0';if(r>=100){label='LENDA VIVA';color='#ffd700';}else if(r>=50){label='HERÓI';color='#60c060';}else if(r>=20){label='Respeitado';color='#90d090';}else if(r<=-50){label='ODIADO';color='#e04040';}else if(r<=-20){label='Temido';color='#e07050';}ri.innerHTML=`<span style="color:${color};font-family:Cinzel;letter-spacing:2px;">${label}</span><br><span style="color:#c0a050;">${r}</span>`;}
  updateSprite();
}

function clearScreen(){screen.innerHTML='';}
function addHTML(html){const d=document.createElement('div');d.innerHTML=html;screen.appendChild(d);setTimeout(()=>{screen.scrollTop=screen.scrollHeight;},50);}
function addChoices(choices){
  const div=document.createElement('div');div.className='choices';
  choices.forEach(c=>{const btn=document.createElement('button');btn.textContent=c.text;if(c.disabled)btn.disabled=true;if(c.cls)btn.className=c.cls;btn.onclick=()=>{initAudio();sfxClick();if(c.action)c.action();};div.appendChild(btn);});
  screen.appendChild(div);setTimeout(()=>{screen.scrollTop=screen.scrollHeight;},50);
}
function setLocation(n){locationEl.textContent='— '+n+' —';}
function setChapter(n,name){chapterEl.textContent='Cap. '+n+(name?' — '+name:'');}
function flashScreen(c){const g=document.getElementById('game');g.classList.add(c);setTimeout(()=>g.classList.remove(c),1200);}
function shakeScreen(){const g=document.getElementById('game');g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),400);}
function addInsanity(v){game.insanity=Math.min(100,game.insanity+v);updateStats();if(game.insanity>=75){document.getElementById('game').classList.add('insanity-effect');}}
function changeReputation(v){game.reputation+=v;game.flags.reputationVisible=true;updateStats();}
function addSatellaTrust(v){game.satellaTrust=Math.max(0,Math.min(100,game.satellaTrust+v));updateStats();}

// ==================== SISTEMA DE PACTOS CORRIGIDO ====================
function recalcSatanPower(){game.satanPower=Math.min(100,game.demonPacts.length*14+(game.hasPact?2:0));updateStats();if(game.satanPower>=100)unlockAchievement('full_satan');}
function makeDemonPact(demonId){
  const d=DEMONS.find(x=>x.id===demonId);
  if(!d)return;
  if(game.demonPacts.includes(demonId))return;
  try{d.apply();}catch(e){console.error('Erro:',e);}
  game.demonPacts.push(demonId);
  addToBestiary(demonId);
  recalcSatanPower();
  if(game.demonPacts.length===1)unlockAchievement('first_demon');
  if(game.demonPacts.length===3)unlockAchievement('three_demons');
  if(game.demonPacts.length===5)unlockAchievement('five_demons');
  if(game.demonPacts.length===7)unlockAchievement('all_demons');
  sfxPact();flashScreen('flash-hell');shakeScreen();
  updateStats();saveGame();
  clearScreen();setLocation('Pacto Feito');
  addHTML(`<h2 style="text-align:center;color:#ff5080;">✦ PACTO FEITO ✦</h2>
    <div class="satan-card">
      <p style="color:#ff0040;font-size:32px;font-family:'UnifrakturMaguntia',serif;letter-spacing:4px;margin-bottom:12px;">${d.icon} ${d.name.toUpperCase()}</p>
      <p style="color:#d0c0b0;font-style:italic;font-size:16px;line-height:1.7;">"${d.dialogue}"</p>
      <div style="margin-top:16px;padding:12px;background:rgba(0,0,0,0.4);border:1px solid #4a2020;">
        <p class="loot" style="margin:6px 0;">✦ ${d.bonus}</p>
        <p style="color:#ff6060;font-weight:600;margin:6px 0;">⚠ ${d.curse}</p>
      </div>
      <p class="satan" style="margin-top:16px;font-size:20px;">Poder de Satanás: ${game.satanPower}%</p>
      <p style="color:#a09080;margin-top:8px;">${game.demonPacts.length}/7 pactos</p>
    </div>`);
  addChoices([{text:'▶ Voltar ao Inferno',action:sceneInferno}]);
}

function sceneInferno(){
  clearScreen();setLocation('O Inferno');setChapter('∞','Os Sete Círculos');sfxHell();
  addHTML(`<h1 style="color:#ff0040;font-size:42px;">O INFERNO</h1>
    <p class="narration" style="text-align:center;color:#c0a0a0;">"Sete círculos. Sete pactos. Um trono."</p>
    <div class="satan-power-text">PODER DE SATANÁS</div>
    <div class="satan-power-bar"><div class="satan-power-fill" style="width:${game.satanPower}%"></div></div>
    <p style="text-align:center;color:#ff5080;font-family:Cinzel;font-size:14px;letter-spacing:2px;">${game.satanPower}/100</p>`);
  const container=document.createElement('div');
  DEMONS.forEach(d=>{
    const pacted=game.demonPacts.includes(d.id);

// ==================== COMBATE ====================
let combat=null;
function startCombat(enemyName,enemyHp,enemyAtk,tier,onWin){
  combat={enemyName,enemyHp,enemyHpMax:enemyHp,enemyAtk,tier,enemyStun:0,playerStun:0,playerHaste:false,playerDefenseBoost:0,enemyBlind:0,playerReflect:false,playerEvade:false,turn:1,log:[],onWin};
  const bm={'Servo Divino':'servo','Multidão':'multidao','O Primeiro Deus':'deus1','O Segundo Deus':'deus2','O Terceiro Deus':'deus3','O Quarto Deus':'deus4','Aetheron':'aetheron','Namaroth':'namaroth'};
  if(bm[enemyName])addToBestiary(bm[enemyName]);
  renderCombat();
}
function combatLog(m){combat.log.push(m);if(combat.log.length>6)combat.log.shift();}
function renderCombat(){
  clearScreen();setLocation('Combate: '+combat.enemyName);
  const pPct=Math.max(0,(game.hp/game.hpMax)*100);
  const ePct=Math.max(0,(combat.enemyHp/combat.enemyHpMax)*100);
  addHTML(`
    <div class="combat-arena">
      <div class="fighter" id="playerFighter"><div class="name">ALASTOR</div><div style="width:70px;height:110px;position:relative;">${document.getElementById('spriteFrame').querySelector('.pixel-sprite').outerHTML}</div><div class="hp-mini player-hp"><div style="width:${pPct}%"></div></div></div>
      <div style="font-family:'Cinzel';color:#e04040;font-size:30px;text-shadow:0 0 20px #f00;">⚔</div>
      <div class="fighter" id="enemyFighter"><div class="name" style="color:${combat.tier==='deus'?'#ffe080':'#ffb040'};">${combat.enemyName.toUpperCase()}${combat.enemyBlind>0?' (CEGO)':''}</div><div class="${combat.enemyBlind>0?'blind-effect':''}">${renderEnemySprite(combat.tier==='deus')}</div><div class="hp-mini enemy-hp"><div style="width:${ePct}%"></div></div></div>
    </div>
    <div id="combatLog">${combat.log.map(l=>`<p>${l}</p>`).join('')}</div>
    <h2>Turno ${combat.turn}</h2>
  `);
  const choices=[];
  game.skills.forEach((s,i)=>{
    if(!s.unlocked)return;
    const canUse=game.mana>=s.custo&&combat.playerStun===0;
    let extra='';if(s.efeito==='blind')extra+=' ☇';if(s.efeito==='hp_cost'||s.efeito==='hp_cost_heal')extra+=' 🩸';
    choices.push({text:`✦ ${s.nome} (${s.custo}m${s.dano>0?' • '+s.dano+'d':''})${extra}`,cls:canUse?'magic-btn':'',disabled:!canUse,action:()=>useSkill(i)});
  });
  choices.push({text:'🛡 Defender',disabled:combat.playerStun>0,action:useDefend});
  const wrap=document.createElement('div');wrap.className='choices';wrap.style.display='grid';wrap.style.gridTemplateColumns='1fr 1fr';
  choices.forEach(c=>{const btn=document.createElement('button');btn.textContent=c.text;btn.className=c.cls||'';btn.disabled=c.disabled;btn.onclick=()=>{initAudio();sfxClick();c.action();};wrap.appendChild(btn);});
  screen.appendChild(wrap);
}
function renderEnemySprite(isGod){
  if(isGod){return `<div style="width:80px;height:110px;position:relative;filter:drop-shadow(0 0 20px #fa0);"><div style="position:absolute;left:50%;top:0;transform:translateX(-50%);width:60px;height:60px;background:radial-gradient(circle,#ffe080,#a04000);border-radius:50%;box-shadow:0 0 40px #fa0;"></div><div style="position:absolute;left:50%;top:15px;transform:translateX(-50%);width:40px;height:40px;background:#301000;"></div><div style="position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:8px;"><div style="width:6px;height:6px;background:#ff0040;"></div><div style="width:6px;height:6px;background:#ff0040;"></div></div><div style="position:absolute;left:50%;top:55px;transform:translateX(-50%);width:44px;height:55px;background:linear-gradient(180deg,#401000,#100400);"></div></div>`;}
  return `<div style="width:70px;height:100px;position:relative;"><div style="position:absolute;left:50%;top:10px;transform:translateX(-50%);width:28px;height:28px;background:#e0d0b0;"></div><div style="position:absolute;left:50%;top:20px;transform:translateX(-50%);display:flex;gap:5px;"><div style="width:4px;height:4px;background:#fff;"></div><div style="width:4px;height:4px;background:#fff;"></div></div><div style="position:absolute;left:50%;top:38px;transform:translateX(-50%);width:30px;height:50px;background:linear-gradient(180deg,#e0e0f0,#8080a0);"></div></div>`;
}
function floatDamage(isE,dmg){const t=document.getElementById(isE?'enemyFighter':'playerFighter');if(!t)return;const d=document.createElement('div');d.className='float-dmg';d.textContent='-'+dmg;d.style.left='50%';d.style.top='40%';t.appendChild(d);setTimeout(()=>d.remove(),1000);}
function animateAttack(isE){const el=document.getElementById(isE?'enemyFighter':'playerFighter');if(!el)return;el.classList.add('attack-anim');setTimeout(()=>el.classList.remove('attack-anim'),350);}
function animateHit(isE){const el=document.getElementById(isE?'enemyFighter':'playerFighter');if(!el)return;el.classList.add('hit-anim');setTimeout(()=>el.classList.remove('hit-anim'),350);}
function bloodDripEffect(){const g=document.getElementById('game');for(let i=0;i<6;i++){const d=document.createElement('div');d.className='blood-drip';d.style.left=(Math.random()*80+10)+'%';d.style.top=(Math.random()*40)+'%';d.style.height=(10+Math.random()*20)+'px';g.appendChild(d);setTimeout(()=>d.remove(),1500);}g.classList.add('hp-cost-effect');setTimeout(()=>g.classList.remove('hp-cost-effect'),600);}
function blindMissEffect(){const e=document.getElementById('enemyFighter');if(e){e.classList.add('blind-effect');setTimeout(()=>e.classList.remove('blind-effect'),800);}flashScreen('flash-white');}
function useSkill(idx){
  const sk=game.skills[idx];if(game.mana<sk.custo)return;
  game.mana-=sk.custo;
  if(sk.efeito==='hp_cost'){const hc=sk.nome.includes('Pacto')?25:(sk.nome.includes('Sacrifício')?40:8);game.hp-=hc;bloodDripEffect();combatLog(`🩸 ${sk.nome}: -${hc} HP!`);updateStats();if(game.hp<=0){endCombat(false);return;}}
  if(sk.efeito==='hp_cost_heal'){const hc=30;const heal=sk.nome.includes('Pacto')?99:60;game.hp-=hc;game.hp=Math.min(game.hpMax,game.hp+heal);bloodDripEffect();combatLog(`🩸 -${hc} HP, +${heal} HP.`);updateStats();endPlayerTurn();return;}
  if(sk.efeito==='heal'){const h=40;game.hp=Math.min(game.hpMax,game.hp+h);combatLog(`+${h} HP.`);endPlayerTurn();return;}
  if(sk.efeito==='defesa'){combat.playerDefenseBoost=2;combatLog(`Defesa+.`);endPlayerTurn();return;}
  if(sk.efeito==='stun'){combat.enemyStun=1;combatLog(`Atordoado!`);if(sk.dano>0){combat.enemyHp-=sk.dano;floatDamage(true,sk.dano);animateHit(true);}endPlayerTurn();return;}
  if(sk.efeito==='reflect'){combat.playerReflect=true;combatLog(`Reflete!`);endPlayerTurn();return;}
  if(sk.efeito==='evade'){combat.playerEvade=true;combatLog(`Esquiva.`);endPlayerTurn();return;}
  if(sk.efeito==='haste'){combat.playerHaste=true;combatLog(`Age 2x!`);endPlayerTurn();return;}
  if(sk.efeito==='blind'){combat.enemyBlind=2;combatLog(`☇ INIMIGO CEGO!`);blindMissEffect();}
  const bonus=game.hasPact?1.3:1;const intB=1+(game.int*0.05);
  const dmg=Math.floor(sk.dano*bonus*intB);
  combat.enemyHp-=dmg;floatDamage(true,dmg);animateAttack(false);animateHit(true);
  combatLog(`Dano: ${dmg}.`);sfxMagic();
  if(combat.enemyHp<=0){endCombat(true);return;}
  endPlayerTurn();
}
function useDefend(){combat.playerDefenseBoost=1;combatLog('Defendeu.');endPlayerTurn();}
function endPlayerTurn(){if(combat.enemyHp<=0){endCombat(true);return;}setTimeout(()=>{if(combat.enemyStun>0){combat.enemyStun--;combatLog(`${combat.enemyName} atordoado.`);return;}enemyTurn();},700);}
function enemyTurn(){
  if(game.hp<=0){endCombat(false);return;}
  animateAttack(true);
  if(combat.enemyBlind>0){if(Math.random()<0.6){combatLog(`☇ ${combat.enemyName} ERROU!`);blindMissEffect();combat.enemyBlind--;combat.turn++;setTimeout(renderCombat,400);return;}combat.enemyBlind--;}
  let dmg=combat.enemyAtk+Math.floor(Math.random()*10);
  if(combat.playerDefenseBoost>0){dmg=Math.floor(dmg*0.4);combat.playerDefenseBoost--;combatLog(`Defesa reduziu para ${dmg}.`);}
  else if(combat.playerEvade){combatLog('Esquivou!');combat.playerEvade=false;return;}
  else{combatLog(`Atacou. Dano: ${dmg}.`);}
  if(combat.playerReflect){combatLog(`✦ Refletido!`);combat.enemyHp-=dmg;combat.playerReflect=false;floatDamage(true,dmg);animateHit(true);if(combat.enemyHp<=0){endCombat(true);return;}return;}
  const defR=Math.floor(dmg*(game.def*0.02));dmg=Math.max(1,dmg-defR);
  game.hp-=dmg;floatDamage(false,dmg);animateHit(false);updateStats();sfxDamage();
  if(game.hp<=0){endCombat(false);return;}
  combat.turn++;
  if(combat.playerHaste){combat.playerHaste=false;combatLog('⚡ Turno extra!');setTimeout(renderCombat,250);}
  else{setTimeout(renderCombat,250);}
}
function endCombat(won){
  setTimeout(()=>{
    clearScreen();
    if(won){
      sfxVictory();
      addHTML(`<h2 style="color:#60c060;">✦ VITÓRIA ✦</h2>`);
      const xp=combat.tier==='deus'?50:(combat.tier==='secreto'?80:8);
      game.int+=Math.floor(xp/3);game.str+=Math.floor(xp/4);game.def+=Math.floor(xp/4);
      game.mana=game.manaMax;game.hp=Math.min(game.hpMax,game.hp+30);
      game.gold+=combat.tier==='deus'?200:(combat.tier==='secreto'?500:20);
      let grimDrop=false;
      if(combat.tier==='deus'&&Math.random()<0.6){game.grimoires++;grimDrop=true;}
      else if(combat.tier==='secreto'){game.grimoires+=3;grimDrop=true;}
      else if(Math.random()<0.1){game.grimoires++;grimDrop=true;}
      updateStats();
      addHTML(`<p class="loot">✦ +${Math.floor(xp/3)} INT | +${Math.floor(xp/4)} FOR | +${Math.floor(xp/4)} DEF | +${combat.tier==='deus'?200:(combat.tier==='secreto'?500:20)} ouro</p>`);
      if(grimDrop)addHTML(`<p class="grimoire">✦ GRIMÓRIO(S) DROPADO(S)! (${game.grimoires} total)</p>`);
      saveGame();
      if(combat.onWin)addChoices([{text:'▶ Continuar',action:combat.onWin}]);
      else addChoices([{text:'▶ Continuar',action:()=>sceneTreino()}]);
    } else {
      sfxDark();
      addHTML(`<h2 style="color:#e04040;">DERROTA</h2><p class="narration">Você cai...</p>`);
      addChoices([{text:'▶ Despertar',action:()=>{game.hp=Math.floor(game.hpMax*0.3);game.mana=Math.floor(game.manaMax*0.3);game.insanity+=5;updateStats();sceneTreino();}}]);
    }
  },1200);
}

// ==================== MENU ====================
function openSysMenu(){
  clearScreen();setLocation('Sistemas');sfxClick();
  addHTML(`<h2>⚙ Sistemas</h2><div class="sys-menu">
    <button onclick="openBestiary()">📖 Bestiário (${game.bestiary.length}/${BESTIARY.length})</button>
    <button onclick="openDiary()">📓 Lore (${game.loreFound.length}/${LORE_FRAGMENTS.length})</button>
    <button onclick="openAchievements()">🏆 Conquistas (${game.achievements.length}/${ACHIEVEMENTS.length})</button>
    <button onclick="openMap()">🗺 Mapa</button>
    <button onclick="toggleSound()">🔊 ${game.soundOn?'ON':'OFF'}</button>
    <button onclick="saveGame();addHTML('<p class=loot>✦ Salvo!</p>');">💾 Salvar</button>
  </div>`);
  addChoices([{text:'◀ Voltar',action:()=>{if(game.magic)sceneTreino();else showTitleScreen();}}]);
}
function toggleSound(){game.soundOn=!game.soundOn;if(game.soundOn)initAudio();addHTML(`<p class="loot">Som: ${game.soundOn?'ON':'OFF'}</p>`);}
function openBestiary(){
  clearScreen();setLocation('Bestiário');
  addHTML(`<h2>📖 Bestiário</h2><p>${game.bestiary.length}/${BESTIARY.length}</p>`);
  BESTIARY.forEach(b=>{const k=game.bestiary.includes(b.id);if(k){addHTML(`<div class="bestiary-entry"><div class="bestiary-name">${b.name}</div><div class="bestiary-stats">${b.hp} • ${b.atk} • ${b.tier}</div><div class="bestiary-desc">${b.desc}</div></div>`);}else{addHTML(`<div class="bestiary-entry bestiary-locked"><div class="bestiary-name">???</div></div>`);}});
  addChoices([{text:'◀ Voltar',action:openSysMenu}]);
}
function openDiary(){
  clearScreen();setLocation('Lore');
  addHTML(`<h2>📓 Diário</h2><p>${game.loreFound.length}/${LORE_FRAGMENTS.length}</p>`);
  LORE_FRAGMENTS.forEach(l=>{if(game.loreFound.includes(l.id)){addHTML(`<div class="diary-entry"><div class="diary-title">✦ ${l.titulo}</div><div class="diary-text">${l.texto}</div></div>`);}else{addHTML(`<div class="diary-entry"><div class="diary-title">???</div></div>`);}});
  addChoices([{text:'◀ Voltar',action:openSysMenu}]);
}
function openAchievements(){
  clearScreen();setLocation('Conquistas');
  addHTML(`<h2>🏆 Conquistas</h2><p>${game.achievements.length}/${ACHIEVEMENTS.length}</p>`);
  ACHIEVEMENTS.forEach(a=>{const u=game.achievements.includes(a.id);addHTML(`<div class="bestiary-entry ${u?'':'bestiary-locked'}"><div class="bestiary-name">${u?'✦ ':'🔒 '}${a.name}</div><div class="bestiary-desc">${a.desc}</div></div>`);});
  addChoices([{text:'◀ Voltar',action:openSysMenu}]);
}
function openMap(){
  clearScreen();setLocation('Mapa');
  const locs=[
    {id:'vila',name:'Vila',icon:'🏘',scene:sceneVillage},
    {id:'floresta',name:'Floresta',icon:'🌲',scene:sceneFloresta},
    {id:'ravina',name:'Ravina',icon:'🌑',scene:scenePentagrama},
    {id:'templo2',name:'2º Deus',icon:'⚡',scene:sceneSegundoDeus},
    {id:'cemiterio',name:'Cemitério',icon:'💀',scene:sceneQuartoDeus},
    {id:'vazio',name:'Trono do Vazio',icon:'🌌',scene:sceneQuintoDeus},
    {id:'namaroth',name:'Namaroth',icon:'👁',scene:sceneNamaroth},
    {id:'inferno',name:'O Inferno',icon:'🔥',scene:sceneInferno}
  ];
  addHTML(`<h2>🗺 Mapa</h2><div class="map-grid" id="mapGrid"></div>`);
  const g=document.getElementById('mapGrid');
  locs.forEach(l=>{const c=document.createElement('div');const v=game.visitedMap.includes(l.id);c.className='map-cell '+(v?'visited':'');c.innerHTML=`<div class="map-icon">${l.icon}</div><div class="map-name">${l.name}</div><div class="map-status">${v?'✓':'—'}</div>`;c.onclick=()=>{initAudio();sfxClick();if(!game.visitedMap.includes(l.id))game.visitedMap.push(l.id);l.scene();};g.appendChild(c);});
  addChoices([{text:'◀ Voltar',action:openSysMenu}]);
}

// ==================== RESET ====================
function resetGame(){
  Object.assign(game,{
    age:0,hp:100,hpMax:100,mana:100,manaMax:100,insanity:0,
    magic:null,magicRarity:null,hasPact:false,
    flags:{},str:1,int:1,def:1,skills:[],
    gold:50,souls:0,reputation:0,hasMana:true,deityKills:0,
    inventory:[],grimoires:0,cultJoined:false,
    godsDefeated:[],arcanaUnlocked:false,
    loreFound:[],macabreNpcsMet:[],
    satellaTrust:50,satellaRevealed:false,satellaRebellion:false,satellaDead:false,
    achievements:[],bestiary:[],visitedMap:[],namarothDefeated:false,
    soundOn:game.soundOn,
    demonPacts:[],satanPower:0,voidRoute:false,hellUnlocked:false
  });
  document.getElementById('game').classList.remove('insanity-effect');
  updateStats();
}

// ==================== INÍCIO ====================
updateStats();
updateContinueButton();
setInterval(()=>{if(game.age>0)saveGame();},30000);
</script>
